<!DOCTYPE html>
<html lang="zh-Hant">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>基督徒書報介紹</title>
	<meta name="description" content="依真理、生命、事奉、福音、詩歌五類，每次給九段書報內容，幫助基督徒在生命與事奉上有更明確的指引。" />
	<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@300;400;600&family=Source+Sans+Pro:wght@300;400;600&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="style.css" />
</head>
<body>

	<header class="site-header">
		<div class="header-inner">
			<div class="title-block">
				<h1>基督徒書報介紹</h1>
				<p class="subtitle">幫助基督徒在生命與事奉上有更明確的指引</p>
			</div>
			<a class="home-link" href="../">← 回首頁</a>
		</div>

		<nav class="tabs" id="tabs" role="tablist"></nav>
	</header>

	<main>
		<p id="status" class="status">正在讀…</p>

		<!-- 五個分類的卡片 -->
		<section id="view-cards" class="view" hidden>
			<div id="cards"></div>
			<div class="card-actions">
				<button id="btn-more" class="btn primary">再換九段</button>
			</div>
		</section>

		<!-- 依書 -->
		<section id="view-books" class="view" hidden>
			<div id="book-list" class="book-list"></div>
			<div id="book-detail" class="book-detail" hidden></div>
		</section>

		<!-- 依期 -->
		<section id="view-issues" class="view" hidden>
			<div id="issue-list" class="issue-list"></div>
			<div id="issue-detail" class="issue-detail" hidden></div>
		</section>

		<section class="about">
			<h2>這頁在做什麼</h2>
			<p>
				選一個分類，一次給你九段書報裡的內容。
				覺得哪一段說到你，就從那一段下面的連結去
				<strong>試讀</strong>整篇，或看那本書的<strong>購買資訊</strong>。
			</p>
			<p>
				每一段都註明出自哪一本書的第幾篇，取自臺灣福音書房的
				<a href="https://ministrydigest.twgbr.org/" target="_blank" rel="noopener">《職事文摘》</a>
				八十期。另外兩個入口：<strong>依書</strong>看一本書被哪幾篇引用過，
				<strong>依期</strong>照卷期看目錄。
			</p>
			<p class="note">
				節錄一頁只取一段，版權屬<a href="https://www.twgbr.org.tw/" target="_blank" rel="noopener">臺灣福音書房</a>；
				要讀整篇請走「試讀」回原站。
			</p>
		</section>
	</main>

	<footer class="site-footer">
		<p>
			內容來源：<a href="https://ministrydigest.twgbr.org/" target="_blank" rel="noopener">職事文摘多媒體資源</a>
			· 書目與購買：<a href="https://www.twgbr.org.tw/" target="_blank" rel="noopener">臺灣福音書房</a>
			· 詩歌：<a href="https://www.hymnal.net/" target="_blank" rel="noopener">hymnal.net</a>
		</p>
	</footer>

	<script src="js/app.js"></script>
</body>
</html>
